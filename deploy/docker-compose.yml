services:
  postgres:
    image: postgres:16-alpine
    container_name: todoservice-postgres
    environment:
      - POSTGRES_DB=todoservice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  todoservice:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: todoservice-node
    depends_on:
      - postgres
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_DATABASE=todoservice

volumes:
  postgres_data:
